name: Audit

# RustSec advisory scan: on dependency changes, and weekly so new advisories
# against an unchanged lockfile still surface.
on:
  push:
    paths: [Cargo.lock, .github/workflows/audit.yml]
  pull_request:
    paths: [Cargo.lock, .github/workflows/audit.yml]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-audit
      - run: cargo audit
